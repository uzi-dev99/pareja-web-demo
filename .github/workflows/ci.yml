name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
        env:
          # Private guard patterns (tests/demo-guard.test.ts): never in the repo.
          DEMO_GUARD_PATTERNS: ${{ secrets.DEMO_GUARD_PATTERNS }}
      - run: bun run build
