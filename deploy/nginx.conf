server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ponytail: gzip para el texto: los SVG de los muebles son 142 KB sin
    # comprimir. Las fotos y los webp ya vienen comprimidos (gzip no los
    # toca: seria gasto sin ganancia).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # API del backend (misma red de compose, servicio pareja-backend).
    # ponytail: resolver + variable -> nginx resuelve el nombre en cada request
    # y no al arrancar: si el backend todavia no esta up, nginx no muere ni
    # queda pegado a una IP vieja cuando el backend se reinicia.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream pareja-backend:3001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # SPA fallback: rutas de React Router caen a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploads servidos desde volumen compartido (read-only)
    location /uploads/ {
        alias /uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # No cachear index.html (siempre trae el bundle más nuevo)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
